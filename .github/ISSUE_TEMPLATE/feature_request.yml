name: Feature idea
description: Suggest a filter or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the use case and why the current app does not meet it.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: A small first version or example is especially helpful.
    validations:
      required: true
